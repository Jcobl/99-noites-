<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>99 Noites - iPhone App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;-webkit-touch-callout:none;user-select:none}
body{background:#0a1a0f;overflow:hidden;font-family:system-ui;color:#fff;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100dvw;height:100dvh}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.bar{background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1px solid #b6ff5a33;padding:8px 12px;border-radius:12px;font-size:13px;font-weight:700}
#fillFire{width:80px;height:8px;background:#222;border-radius:4px;margin-top:4px;overflow:hidden}
#fillFire div{height:100%;background:linear-gradient(90deg,#ff2a00,#ff8a00);width:42%;transition:.3s}
#controls{position:fixed;inset:0;z-index:10;pointer-events:none}
.joy{position:absolute;bottom:20px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffff22,#00000044);border:2px solid #ffffff22;pointer-events:auto}
#joyMove{left:20px}
#joyCam{right:20px;width:140px;height:140px}
.stick{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;background:radial-gradient(circle at 30% 30%,#fff,#ccc);border-radius:50%;box-shadow:0 4px 12px #0008}
.btn{position:absolute;pointer-events:auto;border:none;border-radius:20px;font-weight:800;font-size:12px;padding:10px 14px;box-shadow:0 4px 12px #0008}
#btnAction{left:50%;bottom:90px;transform:translateX(-50%);background:#b6ff5a;color:#000;display:none}
#btnAction.show{display:block}
#btnRun{right:20px;bottom:170px;background:#ff3b30;color:#fff}
#btnEquip{left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;border:1px solid #ffffff22}
</style>
